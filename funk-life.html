<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funk Life</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      padding: 40px 30px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: #ff6b6b;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #d1d5db;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background-color: #ff6b6b;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background-color: #ff5252;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Funk Life</h1>
    <p>Welcome to my official corner of the web. Stay tuned for updates, projects, and more.</p>
    <a href="mailto:youremail@example.com" class="btn">Get in Touch</a>
  </div>
</body>
</html>
